[build-system]
requires = ["setuptools>=68", "setuptools_scm[toml]>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "astrodata"
dynamic = ["version"]
description = "A package for managing astronomical data through a uniform interface"
authors = [
    { name = "DRAGONS development team" },
]
license = { text = "BSD3" }
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "astropy>=7.1.2",
    "asdf>=4.0.0",
    "gwcs>=0.25,<1.0.0a0",
    "jsonschema>=4.21.1,<5",
    "numpy<2.5.0; python_version<'3.12'",
    "numpy>=2.0.0; python_version>='3.12'",
    "requests>=2.34.0,<3",
]

[project.urls]
Homepage = "https://github.com/GeminiDRSoftware/astrodata/"
Documentation = "https://geminidrsoftware.github.io/astrodata/"
Repository = "https://github.com/GeminiDRSoftware/astrodata/"

# Poetry's dependency "groups" (main/dev/docs/test/build_test) become
# standard PEP 621 optional-dependencies ("extras"). Anything installed
# with `pip install .[test]` etc. pulls in `dependencies` above plus the
# extra listed here. There is no more "main" group -- `dependencies` is
# always installed.
[project.optional-dependencies]
dev = [
    "ruff>=0.15.22,<0.16",
    "coverage>=7.10.6,<8",
    "isort>=8.0.0,<9",
    "pre-commit>=4.0.0,<5",
    "xenon>=0.9.1,<0.10",
    "tomlkit>=0.13.0,<0.14",
]
docs = [
    "sphinx>=8.0.0,<9",
    "sphinx-automodapi>=0.17.0,<0.18",
    "sphinx-rtd-theme>=3.0.0,<4",
]
test = [
    "pytest>=8.1.1,<10.0.0",
    "coverage>=7.10.6,<8",
    "genbadge[coverage]>=1.1.3,<2",
    "pytest-cov>=7.0.0,<8",
    "pytest-doctestplus>=1.2.1,<2",
    "hypothesis>=6.99.13,<7",
    "nox>=2024.4.15",
    "watchdog>=6.0.0,<7",
    "docutils>=0.20.1,<0.21",
    "objgraph>=3.6.2,<4",
]
build_test = [
    "devpi-server>=6.14.0,<7",
    "devpi-client>=7.2.0,<8",
    "build>=1.2.0",
    "twine>=5.0.0",
]

[tool.setuptools.packages.find]
include = ["astrodata*"]

# Replaces [tool.poetry-dynamic-versioning]. setuptools_scm derives the
# version from git tags directly; no plugin/backend needs to be swapped
# in build-system.build-backend (unlike poetry-dynamic-versioning, which
# hijacked the backend).
[tool.setuptools_scm]
version_scheme = "post-release"
local_scheme = "no-local-version"
# Your tags are plain "1.2.3" (no "v" prefix), which is setuptools_scm's
# default tag regex, so no `tag_regex` override is required.

[tool.pytest.ini_options]
testpaths = [
  "tests",
  # "docs/examples", # TODO: placeholder for example testing
]

markers = [
    "dragons_remote_data: data used by DRAGONS tests",
    "dragons: tests that require a DRAGONS environment",
]

doctest_plus = "enabled"
text_file_format = "rst"
# TODO: addopts = "--doctest-rst --cov=astrodata --cov-report=html"
addopts = "--doctest-rst"
# TODO: plugins = ["pytest_profiling"]

[tool.coverage.run]
omit = [
 "astrodata/__init*",
 "astrodata/conftest.py",
 "astrodata/*setup_package*",
 "astrodata/tests/*",
 "astrodata/*/tests/*",
 "astrodata/extern/*",
 "astrodata/version*",
 "*/astrodata/__init*",
 "*/astrodata/conftest.py",
 "*/astrodata/*setup_package*",
 "*/astrodata/tests/*",
 "*/astrodata/*/tests/*",
 "*/astrodata/extern/*",
 "*/astrodata/version*",
 "_*.py",
]

[tool.coverage.report]
exclude_lines = [
  # Have to re-enable the standard pragma
  "pragma: no cover",
  # Don't complain about packages we have installed
  "except ImportError",
  # Don't complain if tests don't hit assertions
  "raise AssertionError",
  "raise NotImplementedError",
  # Don't complain about script hooks
  "def main(.*):",
  # Ignore branches that don't pertain to this version of Python
  "pragma: py{ignore_python_version}",
  # Don't complain about IPython completion helper
  "def _ipython_key_completions_",
  # Don't worry about breakpoints (from testing file)
  "breakpoint",
]
precision = 1


# TODO: Expand ruff settings
[tool.ruff]
line-length = 79
exclude = [
   ".*/",
   "_build",
   "build",
    "dist",
    "docs",
    "tests",  # TODO: Need to lint the tests. -- Issue #46
]

include = [
    "astrodata",
    "noxfile.py",
#    "tests/script_tests",
]

[tool.ruff.lint]
# select = ["ALL"]
select = ["F", "E", "D", "I"]

# Ruff ignored linting rules:
# These rules are ignored for the entire project. They should be
# used sparingly and only when the rule is not applicable to the
# project as a whole.
#
# For most of these rules, they should be removed from the ignore
# list and the code should be refactored to remove the issue(s).
#
# Some have associated issues that can be found in the project's
# issue tracker
# (https://github.com/GeminiDRSoftware/astrodata/issues)
#  + ANN: Annotations
#  + B: Bugbear lint rules
#  + C: Complexity
#  + DTZ003: datetime issue
#  + EM: Error messages
#  + FIX: FIXME statements
#  + N811: Imported constant names
#  + PERF: Performance
#  + PTH: os.path issue
#  + PLR: Refactors
#  + PYI024: collections.namedtuple
#  + RET504: Return statement with no value
#  + RUF: Ruff specific rules
#  + SLOT: __slots__ in derived classes
#  + SIM: Simplicity
#  + SLF001: Private member accessed
#  + T201: print statements
#  + TD: TODO statements
#  + TRY003: string literals in exceptions
ignore = [
  "ANN",
  "B",
  "C",
  "COM812",
  "DTZ003", # TODO: datetime issue -- Issue #17
  "EM",
  "FIX",  # TODO: Reinstate TODO statements -- Issue #44
  "N811",
  "PERF",
  "PLR",
  "PTH",  # TODO: os.path issue -- Issue #45
  "PYI024",
  "RET504",
  "RUF",
  "SIM",
  "SLOT",
  "SLF001",
  "T201",
  "TD",  # TODO: Reinstate TODO statements -- Issue #44
  "TRY003",
]

[tool.ruff.lint.per-file-ignores]
# Tests should not be worried about:
#  + ERA001: Commented out code
#  + S101: Use of assert
#  + D: Docstring content
#  + PLR2004: Magic numbers (false positives at times)
#  + SLF001: Private member accessed
#  + N: Naming convention
"tests/*" = [
  "ERA001",
  "S101",
  "D",
  "PLR2004",
  "SLF001",
  "N",
]

"astrodata/testing.py" = [
  "S101",
  "S603",
]

[tool.ruff.format]
skip-magic-trailing-comma = true

[tool.ruff.lint.isort]
split-on-trailing-comma = false

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.flake8-pytest-style]
mark-parentheses = false

[tool.script_tests]
"docs/quickstart.rst" = ""
"docs/manuals/usermanual/intro.rst" = ""
